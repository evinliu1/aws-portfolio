name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs can stop early; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CDK_VERSION: "2.1144.0" # The CDK CLI; keep at or above the CLI used locally.

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The CDK app uploads frontend/dist, so later jobs reuse this exact build.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: frontend/dist
          retention-days: 7

  synth:
    name: CDK synth
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: frontend/dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install -r requirements.txt
      # Builds the CloudFormation template without touching AWS, so broken infra code fails here.
      - run: npx --yes aws-cdk@${{ env.CDK_VERSION }} synth --quiet

  deploy:
    name: Deploy to AWS
    needs: [backend, synth]
    # Pushes to main (and manual runs on main) deploy; pull requests only get tested.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The environment holds the job until it's approved on GitHub, and it's the only
    # place the AWS deploy role trusts (see infra/infra/github_oidc_stack.py).
    environment:
      name: production
      url: https://d2deewjv6ahsj4.cloudfront.net
    concurrency:
      group: deploy-production
      cancel-in-progress: false # Never stop a CloudFormation update halfway.
    permissions:
      contents: read
      id-token: write # Lets the job request the OIDC token that AWS exchanges for credentials.
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: frontend/dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npx --yes aws-cdk@${{ env.CDK_VERSION }} deploy PortfolioStack --require-approval never
